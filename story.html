<body><div class="wrap">
<header><div><h1>勇者ロイドの戦術講義</h1><div class="sub">『よくあるファンタジー世界のバトルゲーム』ストーリー体験版</div></div><a class="btn secondary" href="./">フリーNPC戦へ</a></header>
<section id="menu" class="panel">
 <div class="chapter">STORY DEMO</div><h2>チュートリアルを始める</h2>
 <p>ロイドの記憶から始まり、ロウジャ、ツクネ、カットールとの演習を通して戦術を学びます。</p>
 <div class="menu"><button class="btn" id="newGame"><b>最初から遊ぶ</b><span>操作説明から全編を体験</span></button><button class="btn secondary" id="continueGame"><b>続きから</b><span id="saveText">セーブデータなし</span></button></div>
</section>
<section id="story" class="hidden">
 <div id="storyPanel" class="panel storyPanel" role="button" tabindex="0" aria-label="会話を進める"><div id="progress" class="progress"></div><div id="chapter" class="chapter"></div><div class="portrait"></div><div id="speaker" class="speaker"></div><div id="dialogue" class="dialogue"></div><div id="stageDirection" class="stageDirection"></div><div id="advanceMark" class="advanceMark">▼</div><div id="lessonHud" class="lessonHud hidden"><div class="meterRow"><div id="lessonPlayerMeter" class="meter"><span>子ロイド軍の戦力</span><br><b id="lessonPlayerPower">1000</b><span id="lessonPlayerDelta" class="delta good"></span><div class="bar"><div id="lessonPlayerFill" class="fill" style="width:40%"></div></div></div><div id="lessonEnemyMeter" class="meter enemy"><span>相手の戦力</span><br><b id="lessonEnemyPower">????</b><span id="lessonEnemyDelta" class="delta bad"></span><div class="bar"><div id="lessonEnemyFill" class="fill" style="width:40%"></div></div></div></div></div><div id="storyExtra"></div><div class="controls storyActionBar"><button id="storyAuto" class="btn utility">オート</button><button id="storySkip" class="btn utility">一括省略</button><button id="next" class="btn">次へ</button></div></div>
</section>
<section id="battle" class="hidden">
 <div class="panel"><div class="chapter" id="battleTitle"></div><div id="battleTip" class="tip"></div><div class="unitProfiles"><div id="playerProfile" class="enemyProfile"></div><div id="enemyProfile" class="enemyProfile"></div></div><div class="powerBoard"><div class="powerLane"><div class="powerHead"><span>自軍戦力</span><b id="pPower"></b></div><div class="bar"><div id="pFill" class="fill"></div></div></div><div class="powerLane enemy"><div class="powerHead"><span>敵戦力</span><b id="ePower"></b></div><div class="bar"><div id="eFill" class="fill"></div></div></div></div><div class="battleDialogue"><div id="battleSpeaker" class="battleSpeaker">戦況</div><div id="battleMessage" class="battleMessage waiting">コマンドを選択してください。</div></div></div>
 <div id="strategy" class="panel"><h3>ターン <span id="turn"></span> / 3　コマンドを4枚選択</h3><div id="slots" class="slots"></div><div id="hand" class="hand"></div></div>
 <div id="battleLogPanel" class="panel battleLogPanel hidden"><h3>戦闘履歴</h3><div id="battleLog" class="log"></div></div>
 <div id="battleActionBar" class="battleActionBar hidden"><div class="battleActions"><button id="undo" class="btn secondary">1枚戻す</button><button id="resolve" class="btn" disabled>この順番で実行</button><button id="stepAction" class="btn hidden">次の実働へ</button></div></div>
</section>
<section id="ending" class="panel result hidden"><div class="chapter">DEMO CLEAR</div><h2>ストーリー体験版・完</h2><p>ロイドは正式に勇者として認められた。<br>彼の冒険はこれからも続く。</p><div class="controls" style="justify-content:center"><button class="btn" onclick="location.reload()">タイトルへ</button><a class="btn secondary" href="./">フリーNPC戦へ</a></div></section>
</div>
<div id="chapterFade" class="chapterFade"><div><div id="chapterFadeTitle" class="chapterFadeTitle"></div><div class="chapterFadeSub">TACTICAL STORY</div></div></div>

function save(){localStorage.setItem(SAVE,JSON.stringify({sceneIndex,currentChapter}))}
function updateSaveLabel(){const s=localStorage.getItem(SAVE);$('#continueGame').disabled=!s;$('#saveText').textContent=s?'前回の場面から再開':'セーブデータなし'}

function renderProgress(){currentChapter=Math.max(0,chapters.indexOf(scenes[sceneIndex]?.[0]||chapters[3]));$('#progress').innerHTML=chapters.map((_,i)=>'<i class="'+(i<=currentChapter?'on':'')+'"></i>').join('')}
function speakerTone(name){if(name.includes('心の声'))return 'narrator';if(name.includes('子ロイド')||name.includes('ロウジャ')||name.includes('アゾアラス')||name.includes('？？？'))return 'yellow';if(name.includes('カットール')||name.includes('ツクネ')||name.includes('エルフの男性'))return 'red';if(name==='ロイド'||name.startsWith('ロイド（')||name.includes('騎兵ロイド')||name.includes('聖剣ロイド'))return 'blue';if(name.includes('オリンポス'))return 'green';return 'neutral'}
function colorSpeaker(el,name,base='speaker'){el.textContent=name;el.className=base+' '+speakerTone(name)}
new MutationObserver(()=>document.querySelectorAll('#battleSpeaker,#forcedSpeaker').forEach(el=>{el.className='battleSpeaker '+speakerTone(el.textContent)})).observe(document.body,{subtree:true,childList:true,characterData:true});
function typeDialogue(speaker,text,cue=true){clearInterval(typingTimer);const lines=text.split('\n'),actions=lines.filter(x=>/^（.+）$/.test(x.trim())),spoken=lines.filter(x=>!/^（.+）$/.test(x.trim())).join('\n');typingText=spoken;typingAt=0;typing=true;typingCue=cue;colorSpeaker($('#speaker'),speaker);$('#dialogue').textContent='';$('#stageDirection').textContent=actions.join('\n');$('#advanceMark').classList.remove('show');$('#next').disabled=true;if(matchMedia('(prefers-reduced-motion: reduce)').matches){completeTyping();return}const chars=Array.from(spoken);typingTimer=setInterval(()=>{typingAt=Math.min(chars.length,typingAt+2);$('#dialogue').textContent=chars.slice(0,typingAt).join('');if(typingAt>=chars.length)completeTyping()},28)}
function completeTyping(){if(!typing)return;clearInterval(typingTimer);typing=false;$('#dialogue').textContent=typingText;$('#next').disabled=false;if(typingCue)$('#advanceMark').classList.add('show');scheduleStoryAuto()}
function renderScene(){showStory();const s=scenes[sceneIndex];if(!s)return finishDemo();renderProgress();$('#lessonHud').classList.add('hidden');$('#chapter').textContent=s[0];$('#storyExtra').innerHTML='';$('.storyActionBar').classList.remove('hidden');$('#storyAuto').classList.remove('hidden');$('#storySkip').classList.remove('hidden');$('#next').classList.remove('hidden');$('#next').textContent='次へ';$('#next').onclick=advance;typeDialogue(s[1],s[2],true);if(s[3])handleTag(s[3]);save()}
function handleTag(tag){stopStoryAuto();$('#storyAuto').classList.add('hidden');$('#storySkip').classList.add('hidden');if(tag==='LESSON'){$('.storyActionBar').classList.remove('hidden');typingCue=false;$('#advanceMark').classList.remove('show');renderLesson();return}if(tag==='SCRIPTED_LOWJA'){$('.storyActionBar').classList.add('hidden');typingCue=false;$('#advanceMark').classList.remove('show');scriptedLowja();return}if(tag.startsWith('BATTLE_')){$('#next').textContent='演習開始';$('#next').onclick=()=>startBattle(tag);return}if(tag==='END'){$('#next').textContent='体験版を終える';$('#next').onclick=finishDemo;return}$('#next').textContent='次へ';$('#next').onclick=advance}
function advance(){if(typing){completeTyping();return}if(transitioning)return;const next=sceneIndex+1;if(scenes[next]&&scenes[sceneIndex]&&scenes[next][0]!==scenes[sceneIndex][0]){chapterTransition(next);return}sceneIndex=next;$('#next').onclick=advance;$('#next').textContent='次へ';renderScene()}

function scheduleStoryAuto(){clearTimeout(storyAutoTimer);if(!storyAuto||typing||transitioning||scenes[sceneIndex]?.[3]||$('#next').classList.contains('hidden'))return;storyAutoTimer=setTimeout(()=>{if(storyAuto)advance()},850)}

function enemyProfileHTML(e){if(e.visible===false)return '<div class="enemyProfileName">敵ユニット：???</div><div class="enemyProfileStats"><b>武力 ???</b><b>カリスマ ???</b><b>知略 ???</b></div><div class="enemyProfileSkill"><b>特殊技能：???</b><br>効果：???</div>';const skill=e.skill||{};return '<div class="enemyProfileName">敵ユニット：'+e.name+'</div><div class="enemyProfileStats"><b>武力 '+e.power+'</b><b>カリスマ '+e.cha+'</b><b>知略 '+e.int+'</b></div><div class="enemyProfileSkill"><b>特殊技能：'+(skill.name||'なし')+'</b>'+(skill.name?('　準備'+(skill.cost??'?')+'<br>'+skill.text):'')+'</div>'}
function playerProfileHTML(p){let effect='';if(p.damage)effect='敵戦力を'+p.damage+'減少する';else if(p.gain)effect='自軍戦力を'+p.gain+'増加する';else if(p.mult)effect='決戦スキル・自分の戦力を'+p.mult+'倍する';return '<div class="enemyProfileName">自軍ユニット：'+p.name+'</div><div class="enemyProfileStats"><b>武力 '+p.power+'</b><b>カリスマ '+p.cha+'</b><b>知略 '+p.int+'</b></div><div class="enemyProfileSkill"><b>特殊技能：'+p.skill+'</b>　準備'+p.cost+'<br>'+effect+'</div>'}
function startBattle(tag){const d=JSON.parse(JSON.stringify(defs[tag]));battle={tag,d,turn:1,power:d.p.power,enemy:d.e.power,prep:0,prepUnits:{},enemyPrep:0,decisive:false,selected:[],deck:d.p.deck.map((type,i)=>({type,id:i})),hand:[],discard:[]};draw(8);$('#story').classList.add('hidden');$('#battle').classList.remove('hidden');$('#battleActionBar').classList.remove('hidden');$('#strategy').classList.remove('hidden');$('#battleLogPanel').classList.add('hidden');$('#battleLogPanel').classList.remove('attention');$('#battleLog').innerHTML='';$('#battleSpeaker').textContent=d.e.name;$('#battleMessage').textContent=d.tips[0];$('#battleMessage').classList.remove('waiting');$('#stepAction').onclick=resolveAction;$('#stepAction').classList.add('hidden');$('#playerProfile').innerHTML=playerProfileHTML(d.p);$('#enemyProfile').innerHTML=enemyProfileHTML(d.e);renderBattle()}
function draw(n){while(n--&&battle.deck.length)battle.hand.push(battle.deck.shift())}
function renderBattle(){const b=battle,d=b.d,max=Math.max(d.p.power*4,d.e.power*4,b.power,b.enemy,1),locked=!!b.resolving;$('#battleTitle').textContent=d.title;$('#battleTip').textContent=locked?'実働 '+(b.resolving.i+1)+' / 4：自軍と敵軍のコマンドを同時に公開します。':d.tips[b.turn-1];$('#turn').textContent=b.turn;$('#pPower').textContent=Math.max(0,Math.floor(b.power));$('#ePower').textContent=Math.max(0,Math.floor(b.enemy));$('#pFill').style.width=Math.max(0,b.power/max*100)+'%';$('#eFill').style.width=Math.max(0,b.enemy/max*100)+'%';$('#slots').innerHTML=[0,1,2,3].map(i=>'<div class="slot '+(b.selected[i]?'full':'')+'">'+(b.selected[i]?(i+1)+'. '+nameCmd(b.selected[i].type):(i+1)+'. ―')+'</div>').join('');$('#hand').innerHTML=b.hand.map((c,i)=>'<button class="card" data-i="'+i+'" '+(locked?'disabled':'')+'><small>'+(d.p.prepareOwners?.[c.type]||d.p.name)+'</small><span class="type '+cmdBase(c.type)+'">'+nameCmd(c.type)+'</span></button>').join('');document.querySelectorAll('.card').forEach(x=>x.onclick=()=>selectCard(+x.dataset.i));$('#resolve').disabled=locked||b.selected.length!==4;$('#resolve').classList.toggle('hidden',locked);$('#undo').classList.toggle('hidden',locked);$('#stepAction').classList.toggle('hidden',!locked)}
function cmdBase(t){return t&&t.startsWith('prepare')?'prepare':t}
function nameCmd(t){if(t==='prepareL')return '準備（ロイド）';if(t==='prepareO')return '準備（オリンポス）';return({recruit:'招集',scheme:'策略',prepare:'準備',none:'行動なし'})[t]}
function selectCard(i){if(battle.selected.length>=4)return;battle.selected.push(battle.hand.splice(i,1)[0]);renderBattle()}
$('#undo').onclick=()=>{if(!battle?.selected.length)return;battle.hand.push(battle.selected.pop());renderBattle()};$('#resolve').onclick=resolveTurn;
let queuedLogs=null;
function appendLog(t,c=''){const x=document.createElement('div');x.className=c;x.textContent=t;$('#battleLog').appendChild(x);$('#battleLog').scrollTop=99999}
function addLog(t,c=''){if(queuedLogs){queuedLogs.push({text:t,cls:c});return}appendLog(t,c)}
function lineSpeaker(line){const t=line.text,d=battle.d;if(t.startsWith('敵')||t.includes('敵の《'))return d.e.name;if(t.startsWith('自軍')||t.startsWith('《'))return d.p.name;if(t.startsWith('実働'))return '実働 '+(battle.resolving.i+1);return '戦況'}
function showBattleLine(line){colorSpeaker($('#battleSpeaker'),lineSpeaker(line),'battleSpeaker');$('#battleMessage').textContent=line.text;$('#battleMessage').classList.remove('waiting');appendLog(line.text,line.cls)}
function focusBattleLog(){const p=$('#battleLogPanel');p.classList.remove('hidden');p.classList.add('attention');setTimeout(()=>p.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'}),40)}
function resolveTurn(){const b=battle;b.resolving={i:0,enemyActs:b.d.e.turns[b.turn-1],messages:null,waitingFinalize:false};$('#strategy').classList.add('hidden');focusBattleLog();addLog('―― ターン'+b.turn+'・実働フェイズ開始 ――','skill');$('#battleSpeaker').textContent=b.d.e.name;$('#battleMessage').textContent=b.d.tips[b.turn-1];$('#stepAction').textContent='実働1を公開';renderBattle()}
$('#stepAction').onclick=resolveAction;
function resolveAction(){const b=battle,d=b.d,r=b.resolving;if(!r)return;if(r.messages&&r.messages.length){showBattleLine(r.messages.shift());$('#stepAction').textContent=r.messages.length?'次のメッセージ':'実働結果を確定';return}if(r.waitingFinalize){r.waitingFinalize=false;r.messages=null;r.i++;renderBattle();if(b.power<=0||b.enemy<=0||r.i>=4){finishResolvedTurn();return}$('#battleSpeaker').textContent='戦況';$('#battleMessage').textContent='次の実働を公開します。';$('#stepAction').textContent='実働'+(r.i+1)+'を公開';return}const i=r.i,pcRaw=b.selected[i]?.type||'none',pc=cmdBase(pcRaw),ec=r.enemyActs[i]||'none';queuedLogs=[];addLog('実働'+(i+1)+'公開｜自軍：'+nameCmd(pcRaw)+' ／ 敵軍：'+nameCmd(ec),'skill');const eSchemeBlocked=pc==='recruit'&&ec==='scheme',pSchemeBlocked=ec==='recruit'&&pc==='scheme';if(pc==='recruit'){b.power+=d.p.cha;addLog('自軍の招集：戦力 ＋'+d.p.cha,'good')}if(pc==='scheme'){if(pSchemeBlocked)addLog('自軍の策略は敵の招集に打開された');else{b.enemy-=d.p.int;addLog('自軍の策略：敵戦力 −'+d.p.int,'good')}}if(pc==='prepare'){const owner=d.p.prepareOwners?.[pcRaw];if(owner){b.prepUnits[pcRaw]=(b.prepUnits[pcRaw]||0)+1;addLog(owner+'が準備 '+b.prepUnits[pcRaw]+'/'+d.p.cost);if(b.prepUnits[pcRaw]>=d.p.cost){b.prepUnits[pcRaw]=0;b.enemy-=d.p.damage;addLog(owner+'の《'+d.p.skill+'》：敵戦力 −'+d.p.damage,'skill')}}else{b.prep++;addLog('自軍が準備 '+b.prep+'/'+d.p.cost);if(b.prep>=d.p.cost){b.prep=0;if(d.p.damage){b.enemy-=d.p.damage;addLog('《'+d.p.skill+'》敵戦力 −'+d.p.damage,'skill')}if(d.p.gain){b.power+=d.p.gain;addLog('《'+d.p.skill+'》戦力 ＋'+d.p.gain,'skill')}if(d.p.mult){b.decisive=true;addLog('《'+d.p.skill+'》決戦準備完了','skill')}}}}if(ec==='recruit'){b.enemy+=d.e.cha;addLog('敵の招集：敵戦力 ＋'+d.e.cha,'bad')}if(ec==='scheme'){if(eSchemeBlocked)addLog('敵の策略を招集で打開した','good');else{b.power-=d.e.int;addLog('敵の策略：自軍戦力 −'+d.e.int,'bad')}}if(ec==='prepare'){b.enemyPrep++;addLog('敵が準備を行った');if(d.e.charge){if(pc==='recruit'){b.power-=300;addLog('敵の《突撃》：招集中を狙われ戦力 −300','bad')}if(pc==='prepare'){if(d.p.prepareOwners?.[pcRaw])b.prepUnits[pcRaw]=Math.max(0,(b.prepUnits[pcRaw]||0)-1);else b.prep=Math.max(0,b.prep-1);addLog('敵の《突撃》：'+(d.p.prepareOwners?.[pcRaw]||'自軍')+'の準備を1減少','bad')}}const hit=d.e.skillTurns?.find(x=>x[0]===b.turn-1&&x[1]===i);if(hit){b.power-=hit[2];addLog('敵の《ゲリラ戦術》：戦力 −'+hit[2],'bad')}}r.messages=queuedLogs;queuedLogs=null;r.waitingFinalize=true;renderBattle();showBattleLine(r.messages.shift());$('#stepAction').textContent=r.messages.length?'次のメッセージ':'実働結果を確定'}
function finishResolvedTurn(){const b=battle,d=b.d;b.discard.push(...b.selected);b.selected=[];b.resolving=null;$('#stepAction').classList.add('hidden');if(b.enemy<=0)return battleEnd(true);if(b.power<=0)return battleEnd(false);if(b.turn===3){let pp=b.power,ep=b.enemy;if(b.decisive)pp*=d.p.mult;if(d.e.mult)ep*=d.e.mult;b.power=Math.floor(pp);b.enemy=Math.floor(ep);$('#battleSpeaker').textContent='決戦';$('#battleMessage').textContent='決戦スキル発動後｜自軍 '+b.power+' ／ 敵軍 '+b.enemy;addLog('決戦！ 自軍 '+b.power+' / 敵軍 '+b.enemy,'skill');renderBattle();return battleEnd(b.power>b.enemy)}b.turn++;draw(4);addLog('―― ターン'+b.turn+'・戦略フェイズ ――','skill');$('#battleLogPanel').classList.add('hidden');$('#battleLogPanel').classList.remove('attention');$('#strategy').classList.remove('hidden');renderBattle();$('#strategy').scrollIntoView({behavior:'smooth',block:'center'})}
function battleEnd(win){const b=battle;$('#strategy').classList.add('hidden');const box=document.createElement('div');box.className='panel result';box.id='battleResult';if(win){box.innerHTML='<h2 class="good">勝利</h2><p>戦術を身につけ、演習を突破した。</p><button class="btn" id="afterBattle">物語を続ける</button>';$('#battle').appendChild(box);$('#afterBattle').onclick=()=>{box.remove();$('#battleActionBar').classList.add('hidden');$('#strategy').classList.remove('hidden');$('#battle').classList.add('hidden');sceneIndex++;renderScene()};return}const lines=Array.isArray(b.d.lose)?b.d.lose:[['オリンポス',String(b.d.lose)]],showLine=()=>{const line=lines.shift();if(line){$('#battleSpeaker').textContent=line[0];$('#battleMessage').textContent=line[1];appendLog(line[0]+'｜'+line[1],'bad');$('#stepAction').textContent=lines.length?'次のセリフ':'再挑戦へ';return}box.remove();startBattle(b.tag)};box.innerHTML='<h2 class="bad">敗北</h2><p>オリンポスの助言を聞こう。</p>';$('#battle').appendChild(box);$('#stepAction').classList.remove('hidden');$('#stepAction').onclick=showLine;showLine()}
function finishDemo(){localStorage.removeItem(SAVE);$('#story').classList.add('hidden');$('#ending').classList.remove('hidden')}
$('#newGame').onclick=()=>{sceneIndex=0;lessonDone=new Set();lessonStats=null;prepStep=0;renderScene()};$('#continueGame').onclick=()=>{const s=JSON.parse(localStorage.getItem(SAVE)||'{}');sceneIndex=s.sceneIndex||0;renderScene()};$('#next').onclick=advance;updateSaveLabel();
</script></body></html>

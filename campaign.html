<section id="menu" class="panel"><h1>ストーリー攻略戦</h1><p>編成したユニット2体で物語の戦闘を攻略します。</p><div id="formationInfo" class="notice"></div><h2 style="margin-top:16px">戦闘ストーリーを選択</h2><div id="stageMenu" class="menu"></div><p class="small" style="margin-top:12px">前の戦闘をクリアすると次の戦闘が解放されます。体験版のため、章クリア報酬は実際には入手しません。</p><a href="formation-preview.html" class="btn secondary" style="display:inline-block;text-decoration:none">編成を変更</a></section>

let formation=['tsukune','jackeen'];try{const s=JSON.parse(localStorage.getItem('fantasyFormation'));if(Array.isArray(s)&&s.length===2&&s.every(id=>CHARS[id]))formation=s}catch(e){}if(formation[0]==='vanilla'&&formation[1]==='vanilla')formation=['vanilla','vanilla_clone'];if(CHARS[formation[0]].evolutionGroup&&CHARS[formation[0]].evolutionGroup===CHARS[formation[1]].evolutionGroup)formation=['tsukune','jackeen'];

 goblinScheme:{enemy:'goblinScheme',title:'ゴブリン戦',lose:[['オリンポス','えーっと、逆にどうやって負けたの。ちゃんとコマンド使った？　おかしいな。負ける方が難しいよ']]},

 orc:{enemy:'orc',title:'オーク戦',lose:[['オリンポス','それなりに手応えのある相手だったね。相手の招集は強いコマンドでこっちの策略を無効にしてくる。逆に準備中に相手の策略を受けると結構痛いね。今回の相手は戦略を変えてこないから今回とはコマンドを変えてもう1回挑戦してみない？']]},
 ggg1:{enemy:'ggg1',title:'GGGゴーレム戦・1回目',lose:[['メイラン','レーザービーム強ーい。でもでも、相手は1ターン目から準備を初めてるからタイミングは計れそう。後は、策略は招集で防げるからちゃんと防いで戦えば勝負になると思うよ']]},
 ggg2:{enemy:'ggg2',title:'GGGゴーレム戦・2回目',lose:[['オリンポス','かなりの強敵だ。レーザービームが強いね。対策は特殊技能のタイミングを考える。特に2ターン目を跨いで特殊技能を使おうとするとキャンセルされちゃうからね。\n後はやっぱり序盤の招集が大事だ。戦力がある程度ないとレーザービームで倒されちゃう。招集と特殊技能のタイミングが大切な戦闘だね']]}
};
Object.assign(ENEMIES,EXTRA_ENEMIES);Object.assign(BATTLES,EXTRA_BATTLES);
const N=t=>({type:'narration',text:t}),D=(speaker,text)=>({type:'dialogue',speaker,text}),I=t=>({type:'notice',text:t}),B=id=>({type:'battle',id});

startBattle=function(id){startBattleTraitsBase(id);battle.playerCharismaMult=Object.fromEntries(formation.map(unitId=>[unitId,1]));battle.playerUnitStatMult=Object.fromEntries(formation.map(unitId=>[unitId,1]));battle.soloCount=Object.fromEntries(formation.map(unitId=>[unitId,0]));battle.curtainCallReady={};battle.nextUid=1000;battle.playerDamageMult=1;battle.enemyGainMult=1;battle.tacticsPending=false;battle.tacticsUses=0;const count=formation.filter(unitId=>CHARS[unitId].traitId==='persuasion').length;if(count){campaignGainPlayer(200*count);addLog(`特性「説得」：戦力 +${200*count}`,'skill')}if(formation.some(unitId=>CHARS[unitId].traitId==='love')){formation.forEach(unitId=>battle.playerPrep[unitId]++);addLog('特性「恋心」：全ユニットの準備 +1（特殊技能は発動しない）','skill')}renderBattle()};
const showCampaignCommandsTraitsBase=showCampaignCommands;
showCampaignCommands=function(){const count=formation.filter(unitId=>CHARS[unitId].traitId==='persuasion').length;if(count){campaignGainPlayer(200*count);addLog(`特性「説得」：戦力 +${200*count}`,'skill')}showCampaignCommandsTraitsBase()};
const renderCampaignHudBase=renderBattle;
renderBattle=function(){renderCampaignHudBase();if(battle?.enemy){const formatEnemy=e=>profile({...e,power:e.powerStat,trait:e.trait==='reckless'?(e.durable?'無謀／耐久戦':'無謀／無我夢中（火災）'):e.trait});$('#enemyProfile').innerHTML=battle.enemy.units?Object.values(battle.enemy.units).map(formatEnemy).join(''):formatEnemy(battle.enemy)}updateCampaignHud();if(battle?.enemy?.units){const ready=Object.entries(battle.enemy.units).filter(([,u])=>u.skill).map(([key,u])=>`${u.name} ${battle.enemyPrepUnits?.[key]||0} / ${u.skill.cost}`);$('#campaignHudEnemyPrep').textContent=ready.length?'準備 '+ready.join('・'):'準備なし'}};
</script></body></html>

<section id="menu" class="panel"><h1>ストーリー攻略戦</h1><p>編成したユニット2体で物語の戦闘を攻略します。</p><div id="formationInfo" class="notice"></div><h2 style="margin-top:16px">章を選択</h2><div class="menu"><button class="chapterBtn" data-chapter="1"><b>第1章</b>首都近辺の哨戒任務</button><button class="chapterBtn" data-chapter="2"><b>第2章</b>古代遺跡とGGGゴーレム</button></div><p class="small" style="margin-top:12px">体験版のため、章クリア報酬は実際には入手しません。</p><a href="formation-preview.html" class="btn secondary" style="display:inline-block;text-decoration:none">編成を変更</a></section>

const CHAPTERS={
1:[N('ある世界にそこそこ平和な王国があった。\nその王国は近隣諸国を侵攻する魔王軍に対して危機感を持っていた。\nそのため古の「勇者」と呼ばれる人物を象徴とした、勇者パーティと呼ばれる対魔王軍を設立。\n\nこれはそんな緊迫した世界で勇者となった青年のお話。'),I('※シナリオを１章クリアすると、ユニットが1体貰えるぞ！\n頑張ってクリアしよう。\n体験版の為入手報酬は実際には手に入りません。'),D('エイジ','それで、最初の任務として首都近辺の哨戒業務を任された訳だな'),D('オリンポス','最初から大変な任務よりマシだね'),D('ロイド','ゴブリンの群れを発見。魔王軍の尖兵の可能性あり'),D('エイジ','あれぐらいなら楽勝だろ'),D('オリンポス','いや、配置的に策略の可能性はあるかな'),D('ロイド','初戦としてはちょうど良い相手だな。油断せず確実に仕留めようか'),B('goblinScheme'),D('エイジ','戦闘終了。ほら楽勝だっただろ？'),D('オリンポス','あんまり油断するのは良くないけどね'),D('ロイド','無駄な力が抜けて、良い緊張感になった。これなら次もいい動きができそうだ'),D('エイジ','敵影発見。なになに、何かしているゴブリンらしいな'),D('オリンポス','うーん。多分トラップか何かの配置かな？早めに倒すのが吉だね'),D('ロイド','では現場に急行。何らかの準備中のゴブリンを倒そう'),B('goblinBomb'),D('エイジ','結局このゴブリン達何がしたかったんだ？'),D('オリンポス','これは爆発物だね。爆発してたら危険だったかも'),D('ロイド','完全に組織だった行動だな。近くに親玉がいる可能性が高い'),D('エイジ','親玉を倒せば良いんだな。よし、偵察班気合入れて探せよ'),N('◆◆◆'),D('オリンポス','居たね、親玉'),D('エイジ','オークの群れ、だな。近くのゴブリンの群れを吸収してやがる'),D('オリンポス','ほっといたら近くの村町に被害があるかもしれない'),D('エイジ','相手にも戦略があるかもな。さっきのゴブリンとは違いがありそうだ'),D('ロイド','ゴブリンの群れの親玉の可能性も高い、潰しておきたいな。全軍、戦略体制に移行、どう戦うか考え実戦しよう'),B('orc'),D('ロイド','ふぅ、戦闘終了。お疲れ様'),D('エイジ','なかなかの相手だったが俺の槍さばきには敵わなかったな'),D('オリンポス','魔王軍がこの程度の集まりなら楽なんだけどね'),D('ロイド','とりあえず、他に敵が居ないか調べるが、今日の哨戒業務はここまでにしよう'),D('オリンポス','無理は禁物だからね。了解'),D('エイジ','俺としては物足りないが、リーダーの意見には従うぜ'),D('ロイド','アゾアラスに報告して今日は終わりだな'),D('エイジ','げ、俺あのおっさん苦手なんだよな。ロイド、オリンポス、任せた'),D('オリンポス','こら、エイジ報告も大事な業務だろ'),D('エイジ','ははは、じゃあな'),N('（脱兎'),D('オリンポス','待てエイジ、って足早っ'),D('ロイド','まぁ、あいつも色々ありそうだし、報告は俺とオリンポスでやるとしようか'),N('第1章完'),I('入手報酬：ツクネ\n\nツクネ「よくやった。しかしここまではただの基礎訓練。魔王討伐の「ま」の字にも届かない。今後も精進しろ。ん？　姫騎士萌え？　戦場では男も女も関係ない。歯を食いしばれ！」')],
2:[N('ロイド達の活躍により首都周辺の斥候部隊を倒し、近隣の村町を守った。しかしそれは魔王軍の脅威が足元まで迫っていることを指し示していた。\n\n司令官であるアゾアラスは、ロイド達に古代遺跡の調査を命じる。\n古代技術による戦力増強は急務であり魔王軍との戦略的優位性を逆転させる可能性があるからだった。\n\nロイド、オリンポス、エイジの3名はドラゴンのハーフであるメイランとエルフの長老ロウジャを連れ、古代遺跡へと向かった。'),D('メイラン','メイドの案内で古代遺跡にレッツゴー'),D('エイジ','お前案内してないだろう'),D('オリンポス','メイランはメイン火力だね。案内役はロウジャさん、よろしくお願いしますね'),D('ロウジャ','安心しておれ、お前たちを安全に古代遺跡まで送り届けよう'),D('ロイド','んで、なんで古代遺跡の調査が進んでないんだ？　俺たちは調査向きじゃないだろう'),D('エイジ','だいたい古代遺跡には守護者がつきものなんだよ。わかってねぇなロイドは'),D('オリンポス','あはは、まあそのとおりなんだよね。古代遺跡は守護する通称GGGゴーレムに守られてるんだ'),D('ロウジャ','前に調査団が壊滅しておったのぉ'),D('メイラン','強いのか？'),D('ロウジャ','うむ、GGGゴーレムのレーザービームに苦しめられてのう。こちらの準備を崩す強力な攻撃じゃよ'),I('特殊技能：レーザービーム　準備4\n相手の戦力を1000減少、相手の準備が１以上のすべてのユニットの準備を０にする'),D('エイジ','これはえげつねぇな。俺みたいな俊敏な特殊技能なら影響はねぇが、普通のヤツなら大ダメージだぜ'),D('オリンポス','確か資料によると、相手は古代遺跡のセキュリティー機能と連動して策略を打って来るらしいね。ただゴーレムは連携が苦手らしくて招集つまり仲間に頼る戦法は使わないみたい'),D('エイジ','いつもより招集が重要だよな'),N('古代遺跡内部'),D('メイラン','お宝ないかな？'),D('エイジ','あったら良いけどな。だいたいお宝はボス戦後だぜ'),D('メイラン','ボス戦？'),N('ビービー侵入者発見。これより迎撃体制に移行します。'),D('オリンポス','やっぱり来たね。'),D('ロイド','来るぞ、GGGゴーレムだ。迎撃開始'),B('ggg1'),D('エイジ','削ったが、浅い。'),D('メイラン（ドラゴン）','駄目ー。硬すぎるよぉ'),D('GGGゴーレム','一定以上の戦力を検出。第2戦闘形態に移行'),D('オリンポス','あー、行動パターンが変わった。レーザービームの頻度が増えるかも'),D('ロイド','危険な状態だが、いったん引くか？'),D('エイジ','そんな余裕はなさそうだぜ'),D('GGGゴーレム','迎撃、迎撃、迎撃、迎撃'),D('メイラン（ドラゴン）','うわぁ、さっきより早くなってるー'),D('ロイド','なら、このまま突っ込むしか無いな。レーザービームに注意しつつ突破するぞ'),B('ggg2'),D('GGGゴーレム','error!!error!!損傷多数発見、起動停止します'),D('ロイド','勝った'),D('エイジ','何とか、倒したな'),D('オリンポス','頻度上がると思ってたけど、レーザービーム2連発とかなしだよー'),D('メイラン（ドラゴン）','遺跡、結構派手に壊しちゃったね'),D('ロイド','ふぅ、とりあえずこれでちゃんとした調査ができそうだな'),D('エイジ','ん？そういえば、ロウジャって何処いったんだ？'),N('◆◆◆'),D('ロウジャ','あやつら上手くやったようじゃな。本当にGGGゴーレムを倒してしまいおった'),D('ロウジャ','......おぬしが魔王軍の使者か？'),D('ロウジャ','これはおぬし達が欲しがっていた遺跡の秘宝よ。わしらは盟約を果たした、魔王軍は里を襲わん変わりにわしらは遺跡の秘宝を渡す'),N('魔王軍の使者「」頷いて、秘宝を受け取る'),D('ロウジャ','ロイドよ。悪いのぉ、しかしこれも策略のうちじゃ'),N('第2章完'),I('入手報酬：ロウジャ\n\nロウジャ「策略の基礎と言えばわしじゃな。ハイエルフの美女ロウジャじゃ！　少し身長が足りない？　そんな事人間の勝手じゃろう。わしが美女と言えば美女なんじゃ！」')]
};
let chapter=1,pos=0,auto=false,autoTimer=null,battle=null,returnPos=0;
document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>startChapter(Number(b.dataset.chapter)));
function startChapter(n){chapter=n;pos=0;$('#menu').classList.add('hidden');$('#story').classList.remove('hidden');$('#storyActions').classList.remove('hidden');showEvent()}
function showEvent(){clearTimeout(autoTimer);const events=CHAPTERS[chapter];if(pos>=events.length)return finishChapter();const e=events[pos];if(e.type==='battle'){returnPos=pos+1;startBattle(e.id);return}$('#chapterLabel').textContent=`第${chapter}章` ;$('#storyContent').className=e.type==='narration'?'narration':e.type==='notice'?'notice':'';$('#speaker').textContent=e.speaker||'';$('#text').textContent=e.text;if(auto)autoTimer=setTimeout(nextEvent,1200+Math.min(2800,e.text.length*22))}
function nextEvent(){pos++;showEvent()}$('#nextBtn').onclick=nextEvent;$('#autoBtn').onclick=()=>{auto=!auto;$('#autoBtn').textContent=auto?'オート停止':'オート';if(auto)showEvent();else clearTimeout(autoTimer)};let skipArmed=false;$('#skipBtn').onclick=()=>{if(!skipArmed){skipArmed=true;$('#skipBtn').textContent='もう一度押して省略';setTimeout(()=>{skipArmed=false;$('#skipBtn').textContent='一括省略'},3000);return}skipArmed=false;const events=CHAPTERS[chapter];let i=pos+1;while(i<events.length&&events[i].type!=='battle')i++;pos=i;$('#skipBtn').textContent='一括省略';showEvent()};
function makeDeck(){let deck=[],n=0;formation.forEach(id=>{const c=CHARS[id];Object.entries(c.commands).forEach(([type,count])=>{for(let i=0;i<count;i++)deck.push({uid:n++,unit:id,type})})});for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}return deck}
function profile(c){return `<div class="profile"><h3>${c.name}</h3><div class="stats">武力 ${c.power??c.powerStat}　カリスマ ${c.charisma}　知略 ${c.intel}</div><div class="skill"><b>特殊技能：</b>${c.skill?`${c.skill.name}（準備${c.skill.cost}）<br>${c.skill.text}`:'なし'}</div></div>`}
function startBattle(id){clearTimeout(autoTimer);const def=BATTLES[id],enemy=structuredClone(ENEMIES[def.enemy]),deck=makeDeck();battle={id,def,enemy,turn:1,playerPower:formation.reduce((s,u)=>s+CHARS[u].power,0),enemyPower:enemy.power,playerPrep:Object.fromEntries(formation.map(u=>[u,0])),enemyPrep:0,decisive:{},deck,hand:deck.splice(0,8),selected:[],log:[]};$('#story').classList.add('hidden');$('#storyActions').classList.add('hidden');$('#battle').classList.remove('hidden');$('#battleActions').classList.remove('hidden');$('#result').classList.add('hidden');renderBattle();addLog('戦闘開始。')}
function renderBattle(){const b=battle;$('#battleTitle').textContent=b.def.title;$('#turn').textContent=`${b.turn} / 3`;$('#playerPower').textContent=Math.floor(b.playerPower);$('#enemyPower').textContent=Math.floor(b.enemyPower);$('#enemyPrep').textContent=b.enemyPrep;$('#playerProfiles').innerHTML=formation.map(id=>profile(CHARS[id])).join('');$('#enemyProfile').innerHTML=profile({...b.enemy,power:b.enemy.powerStat});$('#selection').innerHTML=b.selected.map(c=>`<span class="slot">${CHARS[c.unit].name}<br>${cmdName[c.type]}</span>`).join('');$('#hand').innerHTML=b.hand.map(c=>`<button class="card ${c.type}" data-uid="${c.uid}" ${b.selected.length>=4?'disabled':''}><span>${CHARS[c.unit].name}</span><b>${cmdName[c.type]}</b></button>`).join('');document.querySelectorAll('.card').forEach(x=>x.onclick=()=>selectCard(Number(x.dataset.uid)));$('#resolveBtn').disabled=b.selected.length!==4}
function selectCard(uid){const i=battle.hand.findIndex(c=>c.uid===uid);if(i<0||battle.selected.length>=4)return;battle.selected.push(battle.hand.splice(i,1)[0]);renderBattle()}$('#undoBtn').onclick=()=>{if(!battle.selected.length)return;battle.hand.push(battle.selected.pop());renderBattle()};$('#resolveBtn').onclick=resolveTurn;
function addLog(t,cls=''){battle.log.push(t);const d=document.createElement('div');d.className=cls;d.textContent=t;$('#log').appendChild(d);$('#log').scrollTop=$('#log').scrollHeight}
function playerSkill(id){const c=CHARS[id],b=battle;switch(c.skill.id){case'guerrilla':b.enemyPower-=c.intel*1.5;break;case'star':b.playerPower+=formation.reduce((s,u)=>s+CHARS[u].charisma,0)*1.2;break;case'te_golem':b.enemyRecruitMult=.5;break;case'p_commander':b.playerStatMult=1.5;break;case'binding_rope':b.enemyStatMult=(b.enemyStatMult||1)*.8;break;case'vanilla_fist':b.playerPower+=800;break;case'laser':b.enemyPower-=2000;b.enemyPrep=0;break;case'recon':b.enemyPower-=c.power;break;case'cavalry':case'magic_sword':b.decisive[id]=c.skill.multiplier;break}addLog(`${c.name}の特殊技能「${c.skill.name}」が発動！`,'skill')}
function prepPlayer(id){const c=CHARS[id];battle.playerPrep[id]++;if(battle.playerPrep[id]>=c.skill.cost){battle.playerPrep[id]=0;playerSkill(id)}}
function prepEnemy(){const b=battle,e=b.enemy;if(!e.skill)return;b.enemyPrep++;if(b.enemyPrep>=e.skill.cost){if(e.skill.type==='decisive'){b.enemyDecisive=true}else{b.enemyPrep=0;b.playerPower-=e.skill.damage;Object.keys(b.playerPrep).forEach(id=>{if(b.playerPrep[id]>0)b.playerPrep[id]=0});addLog(`${e.name}の「${e.skill.name}」！ 自軍戦力-${e.skill.damage}`,'bad')}}}
function resolveTurn(){const b=battle,acts=b.enemy.turns[b.turn-1];b.playerStatMult=1;b.enemyStatMult=b.enemyStatMult||1;b.enemyRecruitMult=1;addLog(`―― ターン${b.turn} ――`);for(let i=0;i<4;i++){const p=b.selected[i],e=acts[i],pc=CHARS[p.unit];if(p.type==='recruit'){b.playerPower+=pc.charisma*b.playerStatMult;addLog(`${pc.name}：招集 +${pc.charisma}`)}else if(p.type==='scheme'){if(e==='recruit')addLog(`${pc.name}の策略は敵の招集に防がれた`);else{b.enemyPower-=pc.intel*b.playerStatMult;addLog(`${pc.name}：策略 -${pc.intel}`)}}else prepPlayer(p.unit);if(e==='recruit'){b.enemyPower+=b.enemy.charisma*b.enemyStatMult*b.enemyRecruitMult;addLog(`${b.enemy.name}：招集 +${b.enemy.charisma}`)}else if(e==='scheme'){if(p.type==='recruit')addLog(`${b.enemy.name}の策略を招集で防いだ`);else{b.playerPower-=b.enemy.intel*b.enemyStatMult;addLog(`${b.enemy.name}：策略 -${b.enemy.intel}`)}}else prepEnemy();if(b.playerPower<=0||b.enemyPower<=0)break}b.selected=[];if(b.playerPower<=0)return endBattle(false);if(b.enemyPower<=0)return endBattle(true);if(b.turn>=3){Object.values(b.decisive).forEach(mult=>b.playerPower=Math.floor(b.playerPower*mult));if(b.enemyDecisive){b.playerPower-=b.enemy.skill.damage;addLog(`${b.enemy.name}の決戦スキル「${b.enemy.skill.name}」！ 自軍戦力-${b.enemy.skill.damage}`,'bad')}return endBattle(b.playerPower>b.enemyPower)}b.turn++;b.hand.push(...b.deck.splice(0,4));renderBattle()}
function endBattle(win){$('#battleActions').classList.add('hidden');$('#commandPanel').classList.add('hidden');$('#result').classList.remove('hidden');const r=$('#result');if(win){r.innerHTML=`<h2 class="win">勝利</h2><p>自軍 ${Math.floor(battle.playerPower)} ／ 敵軍 ${Math.floor(battle.enemyPower)}</p><div><button id="continueBtn" class="btn">ストーリーを続ける</button></div>`;$('#continueBtn').onclick=()=>{cleanupBattle();pos=returnPos;$('#story').classList.remove('hidden');$('#storyActions').classList.remove('hidden');showEvent()}}else{const lines=battle.def.lose.map(([s,t])=>`<p><b>${s}</b>「${t.replace(/\n/g,'<br>')}」</p>`).join('');r.innerHTML=`<h2 class="lose">敗北</h2>${lines}<div style="display:flex;gap:8px;justify-content:center"><button id="retryBtn" class="btn">同じ編成で再戦</button><a href="formation-preview.html" class="btn secondary" style="text-decoration:none">編成変更</a></div>`;$('#retryBtn').onclick=()=>{cleanupBattle();startBattle(battle.id)}}}
function cleanupBattle(){$('#battle').classList.add('hidden');$('#result').classList.add('hidden');$('#commandPanel').classList.remove('hidden');$('#log').innerHTML=''}
function finishChapter(){$('#story').classList.add('hidden');$('#storyActions').classList.add('hidden');$('#result').classList.remove('hidden');$('#result').innerHTML=`<h2 class="win">第${chapter}章クリア</h2><p>体験版のため、入手報酬は実際には追加されません。</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn" onclick="location.reload()">章選択へ</button><a class="btn secondary" href="formation-preview.html" style="text-decoration:none">編成画面へ</a></div>`}
</script></body></html>

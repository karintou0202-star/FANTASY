attleActions.logMode{display:grid;grid-template-columns:1fr 1fr 2fr}.battleActions .utility{background:#34445f;color:var(--text)}.resultActions{position:fixed;z-index:22;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;background:#111722ee;border-top:1px solid var(--line);padding:10px max(10px,calc((100% - 960px)/2)) calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(9px)}.resultActions .btn{flex:1;max-width:470px;display:flex;align-items:center;justify-content:center;text-decoration:none}

</style></head><body><main class="wrap">
<section id="menu" class="panel"><h1>ストーリー攻略戦</h1><p>編成したユニット2体で物語の戦闘を攻略します。</p><div id="formationInfo" class="notice"></div><h2 style="margin-top:16px">章を選択</h2><div id="stageMenu" class="menu"></div><p class="small" style="margin-top:12px">未読のシーンはストーリー付きで進行します。読了後は戦闘だけを再プレイできます。前のシーンをクリアすると次が解放されます。体験版のため、章クリア報酬は実際には入手しません。</p><a href="formation-preview.html" class="btn secondary" style="display:inline-block;text-decoration:none">編成を変更</a></section>
<section id="story" class="panel storyBox hidden" role="button" tabindex="0" aria-label="会話を進める"><div id="storyProgress" class="storyProgress"></div><div id="chapterLabel" class="chapter"></div><div id="storyContent"><div id="speaker" class="speaker"></div><div id="text" class="text"></div></div><div id="advanceMark" class="advanceMark">▼</div></section>
<section id="battle" class="hidden"><div class="panel"><div id="battleTitle" class="chapter"></div><div class="unitProfiles"><div class="armyGroup"><h3>自軍</h3><div id="playerProfiles" class="unitrow"></div></div><div class="armyGroup"><h3>敵軍</h3><div id="enemyProfile" class="unitrow"></div></div></div><div class="powerBoard"><div class="powerLane"><div class="powerHead"><span>自軍戦力</span><b id="playerPower">0</b></div><div class="bar"><div id="playerFill" class="fill"></div></div></div><div class="powerLane enemy"><div class="powerHead"><span>敵戦力</span><b id="enemyPower">0</b></div><div class="bar"><div id="enemyFill" class="fill"></div></div></div></div><div class="battleDialogue"><div id="battleSpeaker" class="battleSpeaker">戦況</div><div id="battleMessage" class="battleMessage">コマンドを選択してください。</div></div></div><div id="commandPanel" class="panel"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">ターン <span id="turn">1 / 3</span>　戦略フェイズ</h3><span class="small">手札から4枚を使用順に選択</span><button id="campaignForesightBtn" class="btn secondary hidden" style="margin-left:auto">見切り：8枚引き直す</button></div><div id="selection" class="selection"></div><div id="hand" class="hand"></div></div><div id="logPanel" class="panel hidden"><h3>戦闘履歴</h3><div id="log" class="log"></div></div></section>
<section id="result" class="panel result hidden"></section></main>
<div id="storyActions" class="actionBar hidden"><button id="autoBtn" class="btn secondary">オート</button><button id="skipBtn" class="btn secondary">一括省略</button><button id="nextBtn" class="btn">次へ</button></div><div id="battleActions" class="battleActions hidden"><button id="undoBtn" class="btn secondary">1枚戻す</button><button id="resolveBtn" class="btn" disabled>4枚を決定</button><button id="campaignAutoBtn" class="btn utility hidden">オート</button><button id="campaignSkipBtn" class="btn utility hidden">一気に最後まで</button><button id="nextTurnBtn" class="btn hidden">次のターンへ</button></div>
<script src="characters.js?v=0.38"></script><script src="npc.js?v=0.14"></script><script src="campaign-chapters.js?v=0.3"></script><script src="campaign-chapter5.js?v=1"></script><script>
const $=s=>document.querySelector(s),cmdName={recruit:'招集',scheme:'策略',prepare:'準備',blank:'何もしない'};
let formation=['tsukune','jackeen'];try{const s=JSON.parse(localStorage.getItem('fantasyFormation'));if(Array.isArray(s)&&s.length===2&&s.every(id=>CHARS[id]))formation=s}catch(e){}if(formation[0]==='vanilla'&&formation[1]==='vanilla')formation=['vanilla','vanilla_clone'];if(CHARS[formation[0]].evolutionGroup&&CHARS[formation[0]].evolutionGroup===CHARS[formation[1]].evolutionGroup)formation=['tsukune','jackeen'];
function campaignUnitName(id){const name=CHARS[id].name,same=formation.filter(unitId=>CHARS[unitId].name===name);return same.length>1?`${name}${String.fromCharCode(65+same.indexOf(id))}`:name}
const playerName=()=>formation.map(id=>campaignUnitName(id)).join(' ＋ ');
$('#formationInfo').innerHTML=`<b>現在の編成</b><br>${playerName()}`;

const ENEMIES=CAMPAIGN_ENEMIES;
const BATTLES=CAMPAIGN_BATTLES;
const CHAPTERS={};
function splitStoryText(text){return text.match(/[^。！？\n]+[。！？]*|[^\n]+/g)?.map(s=>s.trim()).filter(Boolean)||[text]}
function expandStoryEvents(events){return events.flatMap(e=>e.type==='battle'?[e]:splitStoryText(e.text).filter(text=>text!=='」').map(text=>({...e,text})))}
const CHAPTER_SCENES=Object.fromEntries(Object.entries(CAMPAIGN_CHAPTER_SCENES).map(([chapter,scenes])=>[chapter,Number(chapter)<=4?scenes.map(events=>events.map(event=>({...event}))):scenes.map(expandStoryEvents)]));
const SCENE_TITLES=CAMPAIGN_SCENE_TITLES;
const STAGES=[];
for(const [chapterNo,scenes] of Object.entries(CHAPTER_SCENES)){let start=0;CHAPTERS[chapterNo]=[];scenes.forEach((scene,i)=>{const battleAt=scene.findIndex(e=>e.type==='battle'),stage={chapter:Number(chapterNo),scene:i+1,label:`第${chapterNo}章・シーン${i+1}`,title:SCENE_TITLES[chapterNo][i],start,length:scene.length,battle:battleAt>=0?scene[battleAt].id:null,hasBattle:battleAt>=0,hasPost:battleAt>=0&&battleAt<scene.length-1,final:i===scenes.length-1};STAGES.push(stage);CHAPTERS[chapterNo].push(...scene,{type:'sceneEnd'});start+=scene.length+1})}
let maxUnlocked=Math.max(0,Math.min(STAGES.length,Number(localStorage.getItem('fantasyCampaignUnlocked')||0)));
const READ_STAGES_KEY='fantasyCampaignReadStages_v1';
const stageReadKey=stage=>`${stage.chapter}:${stage.scene}`;
let readStages=new Set();
try{
 const saved=localStorage.getItem(READ_STAGES_KEY);
 if(saved===null){
  // Earlier versions completed a stage only after its ending story.
  readStages=new Set(STAGES.slice(0,maxUnlocked).map(stageReadKey));
  localStorage.setItem(READ_STAGES_KEY,JSON.stringify([...readStages]));
 }else{
  const keys=JSON.parse(saved);
  if(Array.isArray(keys))readStages=new Set(keys.filter(key=>typeof key==='string'&&STAGES.some(stage=>stageReadKey(stage)===key)));
 }
}catch(e){}
const isStageRead=stage=>readStages.has(stageReadKey(stage));
let battleOnly=false;
let currentStage=STAGES[0],currentStageIndex=0,stagePost=false,chapter=1,pos=0,auto=false,autoTimer=null,storyTyping=false,storyTypingTimer=null,storyFullText='',battle=null,returnPos=0,campaignCollecting=false,campaignLogQueue=[],campaignAuto=false,campaignAutoTimer=null,campaignSkipArmed=false,campaignSkipTimer=null,campaignTimerId=null,campaignTime=30;
let selectedMenuChapter=STAGES[Math.min(maxUnlocked,STAGES.length-1)].chapter;
function renderStageMenu(){
 $('#stageMenu').innerHTML=Object.keys(CHAPTERS).map(chapterNo=>{
  const entries=STAGES.map((stage,i)=>({stage,i})).filter(({stage})=>stage.chapter===Number(chapterNo));
  const unlocked=entries[0].i<=maxUnlocked,readCount=entries.filter(({stage})=>isStageRead(stage)).length;
  const scenes=entries.map(({stage,i})=>{
   const read=isStageRead(stage),locked=i>maxUnlocked;
   const status=locked?'未解放':read?'読了済':i<maxUnlocked?'クリア済・未読':'未読';
   const action=read&&stage.hasBattle?'戦闘だけプレイ':read?'ストーリーを読み返す':'ストーリーから開始';
   return `<div class="stageEntry"><button class="chapterBtn" data-stage="${i}" ${locked?'disabled':''}><span class="status">${status}</span><b>シーン${stage.scene}</b>${stage.title}<span class="stageAction">${action}${stage.hasBattle?'':'（戦闘なし）'}</span></button>${read&&stage.hasBattle&&!locked?`<button class="btn secondary replayStoryBtn" data-story-stage="${i}">ストーリーから再プレイ</button>`:''}</div>`;
  }).join('');
  return `<details class="chapterFolder" data-chapter="${chapterNo}" ${Number(chapterNo)===selectedMenuChapter?'open':''}><summary><span class="small">${Number(chapterNo)>=5?'ストーリー②':'ストーリー①'}</span><b>第${chapterNo}章　${CAMPAIGN_CHAPTER_TITLES[chapterNo]||''}</b><span class="small">${unlocked?`${readCount} / ${entries.length} シーン読了`:'未解放'} ・ 戦闘${entries.filter(({stage})=>stage.hasBattle).length}回</span></summary><div class="menu chapterScenes">${scenes}</div></details>`;
 }).join('');
 document.querySelectorAll('[data-stage]:not(:disabled)').forEach(button=>button.onclick=()=>startStage(Number(button.dataset.stage)));
 document.querySelectorAll('[data-story-stage]').forEach(button=>button.onclick=()=>startStage(Number(button.dataset.storyStage),true));
 document.querySelectorAll('[data-chapter]').forEach(folder=>folder.ontoggle=()=>{if(folder.open)selectedMenuChapter=Number(folder.dataset.chapter)});
}
renderStageMenu();
function startStage(i,withStory=false){
 if(!Number.isInteger(i)||i<0||i>=STAGES.length||i>maxUnlocked)return;
 clearTimeout(autoTimer);clearInterval(storyTypingTimer);storyTyping=false;
 auto=false;$('#autoBtn').textContent='オート';
 currentStageIndex=i;currentStage=STAGES[i];chapter=currentStage.chapter;selectedMenuChapter=chapter;pos=currentStage.start;stagePost=false;
 battleOnly=isStageRead(currentStage)&&currentStage.hasBattle&&!withStory;
 $('#menu').classList.add('hidden');$('#result').classList.add('hidden');
 if(battleOnly){startBattle(currentStage.battle);return}
 $('#story').classList.remove('hidden');$('#storyActions').classList.remove('hidden');showEvent();
}
function renderStoryProgress(){const span=Math.max(1,currentStage.length),done=Math.min(span,pos-currentStage.start+1);$('#storyProgress').innerHTML=Array.from({length:Math.min(8,span)},(_,i)=>`<i class="${i/Math.min(8,span)<done/span?'on':''}"></i>`).join('')}
function completeStoryTyping(){if(!storyTyping)return;clearInterval(storyTypingTimer);storyTyping=false;$('#text').textContent=storyFullText;$('#advanceMark').classList.add('show');$('#nextBtn').disabled=false;scheduleStoryAdvance()}

 b.enemyPrepUnits??={};b.enemyPrepUnits[key]=(b.enemyPrepUnits[key]||0)+1;b.enemyPrep=b.enemyPrepUnits[key];
 addLog(`${e.name||b.enemy.name}：準備 ${b.enemyPrepUnits[key]} / ${e.skill.cost}`);
 if(b.enemyPrepUnits[key]<e.skill.cost)return;
 b.enemyPrepUnits[key]=0;b.enemyPrep=0;
 if(e.skill.type==='decisive'){
  b.enemyDecisives??={};b.enemyDecisives[key]={key,multiplier:e.skill.multiplier,damage:e.skill.damage,gain:e.skill.gain,skillName:e.skill.name,name:e.name||b.enemy.name};
  b.enemyDecisive=b.enemyDecisives[(b.enemy.units?Object.keys(b.enemy.units):['main']).find(unitKey=>b.enemyDecisives[unitKey])];
  addLog(`${e.name||b.enemy.name}の決戦スキル「${e.skill.name}」準備完了`,'skill');return;
 }
 const apply=()=>{
 if(e.skill.id==='manipulation'){b.playerManipulation=(b.playerManipulation||0)+1;addLog(`${e.name}の「操作」：次の招集を準備に変更`,'bad');return}
 if(e.skill.id==='escape_move'){b.noPowerLoss=true;addLog(`${e.name}の「逃げの一手」：このターン双方の戦力は減少しない`,'bad');return}
 if(e.skill.id==='ice_claw'){const damage=campaignReducePlayer(campaignEnemyStat(e,key,'power')*1.5);let text='破壊できる手札がなかった';if(b.hand.length){const hit=b.hand.splice(Math.floor(Math.random()*b.hand.length),1)[0];text=`手札の${campaignUnitName(hit.unit)}・${cmdName[hit.type]}を破壊`;}addLog(`${e.name}の「氷の爪」：戦力 -${damage}、${text}`,'bad');return}
 if(e.skill.id==='charge'){const card=b.currentPlayerCard;if(card?.type==='recruit')campaignReducePlayer(campaignEnemyStat(e,key,'power'));else if(card?.type==='prepare')b.playerPrep[card.unit]=Math.max(0,b.playerPrep[card.unit]-1);addLog(`${e.name}の「突撃」：相手の招集・準備に応じて効果（確定済みの特殊技能は取り消さない）`,'bad');return}
 if(e.skill.id==='blizzard'){
  b.powerFog=true;
  if(b.hand.length)b.hand.splice(Math.floor(Math.random()*b.hand.length),1);
  addLog(`${e.name}の「吹雪」：双方の戦力表示を隠し、手札のコマンド1枚を破壊した`,'bad');return;
 }
 if(e.skill.id==='chain_explosion'){
  b.enemyZeroAtFinal=true;const count=Math.min(2,b.deck.length);
  for(let i=0;i<count;i++)b.deck[i]={...b.deck[i],type:'blank'};
  addLog(`${e.name}の「誘爆」：山札の上${count}枚を何もしないカードに変更。決戦時に自身の戦力を0にする`,'bad');return;
 }
 if(e.skill.id==='grandstand'){b.grandstandMult=(b.grandstandMult||1)*1.5;const damage=campaignReducePlayer(e.intel*(b.enemyStatMult||1)*1.7);addLog(`${e.name||b.enemy.name}の「大立ち回り」！ 自軍戦力-${damage}`,'bad');return}
 const damage=campaignReducePlayer(e.skill.damage);if(e.skill.id==='story_laser'||e.skill.id==='laser')Object.keys(b.playerPrep).forEach(id=>{if(b.playerPrep[id]>0)b.playerPrep[id]=0});addLog(`${e.name||b.enemy.name}の「${e.skill.name}」！ 自軍戦力-${damage}`,'bad');
 };
 if(b.preparingSkills)b.pendingSkills.push({id:e.skill.id,apply});else apply();
};
const playerSkillDamageBase=playerSkill;
playerSkill=function(id){const before=battle.enemyPower,skillId=CHARS[id].skill.id;playerSkillDamageBase(id);if(['guerrilla','laser','recon'].includes(skillId)){const raw=before-battle.enemyPower;battle.enemyPower=before;campaignReduceEnemy(raw,skillId==='guerrilla');if(campaignCollecting&&campaignLogQueue.length)campaignLogQueue[campaignLogQueue.length-1].snapshot=battleSnapshot()}};
const startBattleTraitsBase=startBattle;
startBattle=function(id){startBattleTraitsBase(id);battle.playerCharismaMult=Object.fromEntries(formation.map(unitId=>[unitId,1]));battle.playerUnitStatMult=Object.fromEntries(formation.map(unitId=>[unitId,1]));battle.soloCount=Object.fromEntries(formation.map(unitId=>[unitId,0]));battle.curtainCallReady={};battle.nextUid=1000;battle.playerDamageMult=1;battle.enemyGainMult=1;battle.tacticsPending=false;battle.tacticsUses=0;const count=formation.filter(unitId=>CHARS[unitId].traitId==='persuasion').length;if(count){campaignGainPlayer(200*count);addLog(`特性「説得」：戦力 +${200*count}`,'skill')}if(formation.some(unitId=>CHARS[unitId].traitId==='love')){formation.forEach(unitId=>battle.playerPrep[unitId]++);addLog('特性「恋心」：全ユニットの準備 +1（特殊技能は発動しない）','skill')}campaignStrategyStartTraits();renderBattle()};
const showCampaignCommandsTraitsBase=showCampaignCommands;
showCampaignCommands=function(){campaignStrategyStartTraits();const count=formation.filter(unitId=>CHARS[unitId].traitId==='persuasion').length;if(count){campaignGainPlayer(200*count);addLog(`特性「説得」：戦力 +${200*count}`,'skill')}showCampaignCommandsTraitsBase()};
</script></body></html>
